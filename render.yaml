# Render Blueprint — deploys the Express API + a managed Postgres database
# together. Push this repo to GitHub, then in the Render Dashboard:
# New > Blueprint > select this repo > Apply.
#
# You'll be prompted for the "sync: false" values below (CLIENT_URL is
# required; SMTP_*/CLOUDINARY_* are optional — leave blank to skip email
# sending / photo uploads until you're ready to configure them, and add
# them later from the service's Environment tab in the Render Dashboard).
#
# The database schema migrates itself automatically on first boot (see
# config/migrate.js) — no separate migration step is needed here.
#
# Frontend note: this Blueprint deploys the backend only. Deploy frontend/
# separately to GitHub Pages (see frontend/README.md, or the included
# .github/workflows/deploy-pages.yml for an automated option), then point
# frontend/config.js at this service's onrender.com URL (or a custom
# domain) plus "/api".

services:
  - type: web
    name: workbridge-eth-backend
    runtime: node
    plan: free
    rootDir: workbridge-eth-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 15m
      - key: JWT_REFRESH_EXPIRE
        value: 30d
      - key: DATABASE_URL
        fromDatabase:
          name: workbridge-eth-db
          property: connectionString
      - key: CLIENT_URL
        sync: false # your GitHub Pages URL, e.g. https://<user>.github.io — comma-separate multiple origins
      - key: SMTP_HOST
        sync: false # optional — leave blank to log emails to the console instead of sending them
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "WorkBridge ETH <noreply@workbridge.local>"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false # optional — required only for POST /api/users/me/photo to work
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: workbridge-eth-db
    plan: free
    postgresMajorVersion: "16"
